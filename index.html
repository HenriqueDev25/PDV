<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louisiana PDV - v3.0 (Balança + Offline)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #10b981; --bg-dark: #0f172a; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; height: 100vh; overflow: hidden; color: #1e293b; }
        .tab-content { display: none; height: 100%; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        .tab-btn.active { color: white; background: rgba(255,255,255,0.1); border-radius: 12px; }
        .grid-pdv { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.25rem; align-items: start; }
        .product-card { transition: all 0.2s; border: 1px solid #e2e8f0; cursor: pointer; background: white; border-radius: 1.5rem; padding: 1rem; }
        .product-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .carrinho-container { background: var(--bg-dark); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .scroll-area { overflow-y: auto; height: 100%; }
        .hidden-app { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col">

<div id="loginScreen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#0f172a] text-white p-6">
    <div class="bg-white/5 backdrop-blur-xl p-10 rounded-[2.5rem] border border-white/10 text-center w-full max-w-sm shadow-2xl">
        <h1 class="text-4xl font-extrabold mb-8 tracking-tighter">LOUISIANA <span class="text-emerald-500">PDV</span></h1>
        <div class="space-y-4">
            <input type="email" id="loginEmail" placeholder="E-mail" class="w-full bg-white/10 border border-white/10 p-4 rounded-2xl outline-none focus:ring-2 ring-emerald-500">
            <input type="password" id="loginPassword" placeholder="Senha" class="w-full bg-white/10 border border-white/10 p-4 rounded-2xl outline-none focus:ring-2 ring-emerald-500">
            <button onclick="fazerLoginEmail()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl font-bold transition active:scale-95">ENTRAR</button>
        </div>
    </div>
</div>

<div id="appInterface" class="hidden-app flex flex-col h-full">
    <header class="bg-[#0f172a] text-white px-8 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-6">
            <h1 class="text-xl font-black tracking-tighter">LOUISIANA <span class="text-emerald-500">PDV</span></h1>
            <div id="statusConexao" class="flex items-center gap-2 bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
                <span class="text-[10px] text-emerald-400 uppercase font-bold tracking-wider">Online</span>
            </div>
        </div>
        <nav class="flex gap-2 bg-white/5 p-1.5 rounded-2xl">
            <button onclick="switchTab('venda')" class="tab-btn active px-6 py-2.5 text-xs font-bold uppercase">Vendas</button>
            <button onclick="switchTab('estoque')" class="tab-btn px-6 py-2.5 text-xs font-bold uppercase">Estoque</button>
            <button onclick="switchTab('historico')" class="tab-btn px-6 py-2.5 text-xs font-bold uppercase">Relatórios</button>
            <button onclick="switchTab('config')" class="tab-btn px-6 py-2.5 text-xs font-bold uppercase">Ajustes</button>
        </nav>
        <button onclick="logout()" class="text-xs font-bold text-slate-400">Sair</button>
    </header>

    <main class="flex-1 relative overflow-hidden">
        
        <section id="venda" class="tab-content active">
            <div class="flex h-full p-6 gap-6">
                <div class="flex-[3] flex flex-col gap-6 overflow-hidden">
                    <input type="text" id="inputBusca" placeholder="Pesquisar produto ou bipe o EAN..." class="w-full bg-white border-2 p-5 rounded-3xl outline-none focus:border-emerald-500" oninput="renderizarProdutos()">
                    <div id="gridProdutos" class="grid-pdv scroll-area custom-scroll pr-2"></div>
                </div>

                <div class="flex-1 carrinho-container rounded-[2.5rem] flex flex-col text-white min-w-[380px] overflow-hidden">
                    <div class="p-6 border-b border-white/5 flex justify-between items-center">
                        <span class="font-black text-emerald-500 text-[10px] uppercase">Checkout</span>
                        <span id="labelBalancaStatus" class="text-[9px] bg-white/10 px-2 py-1 rounded text-slate-400 uppercase">Balança OFF</span>
                    </div>
                    <div id="carrinhoItens" class="flex-1 scroll-area p-4 space-y-3 custom-scroll"></div>
                    <div class="p-8 border-t border-white/5 bg-white/5 backdrop-blur-md">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-slate-400">Total</span>
                            <span id="totalVenda" class="text-4xl font-black">R$ 0,00</span>
                        </div>
                        <select id="metodoPgto" class="w-full bg-white/10 p-4 rounded-2xl mb-4 text-white outline-none">
                            <option value="dinheiro">Dinheiro</option>
                            <option value="pix">PIX</option>
                            <option value="cartao">Cartão</option>
                        </select>
                        <button onclick="finalizarVenda()" class="w-full bg-emerald-600 p-5 rounded-2xl font-black text-lg shadow-xl active:scale-95">FINALIZAR VENDA</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="estoque" class="tab-content">
            <div class="p-8 flex flex-col h-full gap-8 overflow-y-auto custom-scroll">
                <div class="bg-white p-8 rounded-[2rem] border">
                    <h2 class="text-lg font-bold mb-6">Cadastro de Produto</h2>
                    <form id="formProd" class="grid grid-cols-4 gap-4">
                        <input type="hidden" id="editId">
                        <input type="text" id="nome" placeholder="Nome do Produto" class="col-span-2 p-4 border rounded-2xl" required>
                        <select id="tipoUnidade" class="p-4 border rounded-2xl font-bold bg-slate-50">
                            <option value="UN">Unidade (UN)</option>
                            <option value="KG">Peso (KG)</option>
                        </select>
                        <input type="number" id="preco" placeholder="Preço Venda R$" step="0.01" class="p-4 border rounded-2xl" required>
                        <input type="number" id="custo" placeholder="Preço Custo R$" step="0.01" class="p-4 border rounded-2xl">
                        <input type="number" id="qtd" placeholder="Qtd Inicial" class="p-4 border rounded-2xl">
                        <input type="text" id="imgUrl" placeholder="URL da Imagem" class="col-span-2 p-4 border rounded-2xl">
                        <button type="submit" class="col-span-4 bg-slate-900 text-white py-4 rounded-2xl font-black uppercase">Salvar no Sistema</button>
                    </form>
                </div>
                <div id="listaEstoqueGrid" class="grid-pdv"></div>
            </div>
        </section>

        <section id="config" class="tab-content">
            <div class="p-8 max-w-2xl mx-auto space-y-6">
                <div class="bg-white p-10 rounded-[2.5rem] border shadow-sm">
                    <h2 class="text-2xl font-extrabold mb-6">Configuração da Balança</h2>
                    <div class="space-y-4">
                        <label class="block text-sm font-bold text-slate-500">Modelo da Balança / Protocolo</label>
                        <select id="protocoloBalanca" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                            <option value="toledo">Toledo (P03)</option>
                            <option value="filizola">Filizola (Padrão)</option>
                            <option value="urano">Urano / Elgin</option>
                            <option value="manual">Digitar Peso Manualmente</option>
                        </select>
                        <button onclick="conectarBalanca()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase">Conectar Porta Serial</button>
                        <p class="text-[10px] text-slate-400 text-center">Requer conexão USB/Serial. Funciona apenas em HTTPS ou Localhost.</p>
                    </div>
                </div>
            </div>
        </section>

    </main>
</div>

<div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 scale-90 transition-all duration-500 bg-slate-900 text-white px-10 py-5 rounded-[2rem] z-[200] font-bold shadow-2xl">
    <span id="toastMsg">...</span>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, writeBatch, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBuob65d4nwic1hXTGSsLtc38dEoD1H0zU",
        authDomain: "pdv26-aa76b.firebaseapp.com",
        projectId: "pdv26-aa76b",
        storageBucket: "pdv26-aa76b.firebasestorage.app",
        messagingSenderId: "885941177258",
        appId: "1:885941177258:web:98f2690e07ec0a087cf9d3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let currentUser = null, produtos = [], carrinho = [], port = null;

    // --- MÓDULO OFFLINE ---
    enableIndexedDbPersistence(db).catch(err => console.error("Offline falhou", err));

    // --- MÓDULO BALANÇA ---
    window.conectarBalanca = async () => {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 9600 });
            window.notificar("Balança Conectada!");
            document.getElementById('labelBalancaStatus').innerText = "Balança ON";
            document.getElementById('labelBalancaStatus').classList.replace('text-slate-400', 'text-emerald-400');
        } catch (e) {
            alert("Erro ao abrir porta serial: " + e.message);
        }
    };

    async function lerPeso() {
        const proto = document.getElementById('protocoloBalanca').value;
        if (proto === 'manual') return parseFloat(prompt("Digite o peso (KG):") || 0);
        if (!port) { alert("Conecte a balança nos ajustes!"); return 0; }

        try {
            const writer = port.writable.getWriter();
            const reader = port.readable.getReader();
            
            // Comando Toledo/Urano: ENQ (0x05)
            await writer.write(new Uint8Array([0x05]));
            const { value } = await reader.read();
            
            writer.releaseLock();
            reader.releaseLock();

            const texto = new TextDecoder().decode(value);
            // Regex para pegar apenas os números e tratar decimais
            const pesoLimpo = texto.replace(/[^0-9]/g, "");
            return parseFloat(pesoLimpo) / 1000; // Converte gramas em KG
        } catch (e) {
            return 0;
        }
    }

    // --- LÓGICA PDV ---
    onAuthStateChanged(auth, user => {
        if (user) {
            currentUser = user;
            document.getElementById('loginScreen').classList.add('hidden-app');
            document.getElementById('appInterface').classList.remove('hidden-app');
            inicializarDados();
        } else {
            document.getElementById('loginScreen').classList.remove('hidden-app');
            document.getElementById('appInterface').classList.add('hidden-app');
        }
    });

    function inicializarDados() {
        onSnapshot(collection(db, `usuarios/${currentUser.uid}/produtos`), snap => {
            produtos = snap.docs.map(d => ({ firebaseId: d.id, ...d.data() }));
            window.renderizarProdutos();
            window.renderizarEstoque();
        });
    }

    window.addCarrinho = async (fbId) => {
        const prod = produtos.find(p => p.firebaseId === fbId);
        let qtd = 1;

        if (prod.unidade === 'KG') {
            window.notificar("Aguardando balança...");
            qtd = await lerPeso();
            if (qtd <= 0) return;
        }

        const itemExistente = carrinho.find(i => i.firebaseId === fbId && i.unidade === 'UN');
        if (itemExistente) {
            itemExistente.qtd++;
        } else {
            carrinho.push({ ...prod, qtd: qtd });
        }
        window.atualizarCarrinho();
    };

    window.atualizarCarrinho = () => {
        const lista = document.getElementById('carrinhoItens');
        let total = 0;
        lista.innerHTML = carrinho.map((item, idx) => {
            const subtotal = item.preco * item.qtd;
            total += subtotal;
            return `<div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center">
                <div>
                    <p class="font-bold text-sm">${item.nome}</p>
                    <p class="text-emerald-400 text-xs">${item.qtd.toFixed(3)} ${item.unidade} x R$ ${item.preco.toFixed(2)}</p>
                </div>
                <button onclick="removerItem(${idx})" class="text-red-400">✕</button>
            </div>`;
        }).join('');
        document.getElementById('totalVenda').innerText = `R$ ${total.toFixed(2)}`;
    };

    document.getElementById('formProd').onsubmit = async (e) => {
        e.preventDefault();
        const p = {
            nome: document.getElementById('nome').value,
            unidade: document.getElementById('tipoUnidade').value,
            preco: parseFloat(document.getElementById('preco').value),
            custo: parseFloat(document.getElementById('custo').value || 0),
            estoque: parseFloat(document.getElementById('qtd').value || 0),
            img: document.getElementById('imgUrl').value || 'https://via.placeholder.com/150'
        };
        await addDoc(collection(db, `usuarios/${currentUser.uid}/produtos`), p);
        e.target.reset();
        window.notificar("Produto Cadastrado!");
    };

    window.finalizarVenda = async () => {
        if (carrinho.length === 0) return;
        const total = parseFloat(document.getElementById('totalVenda').innerText.replace('R$ ', ''));
        const batch = writeBatch(db);

        try {
            carrinho.forEach(item => {
                if (item.unidade === 'UN') {
                    batch.update(doc(db, `usuarios/${currentUser.uid}/produtos`, item.firebaseId), { 
                        estoque: item.estoque - item.qtd 
                    });
                }
            });
            
            await addDoc(collection(db, `usuarios/${currentUser.uid}/vendas`), {
                data: new Date().toISOString(),
                total: total,
                pagamento: document.getElementById('metodoPgto').value,
                itens: carrinho.map(i => `${i.qtd}x ${i.nome}`).join(', ')
            });

            await batch.commit();
            carrinho = [];
            window.atualizarCarrinho();
            window.notificar("VENDA FINALIZADA!");
        } catch (err) {
            window.notificar("Erro ao salvar! Estará offline.");
        }
    };

    // --- FUNÇÕES DE AUXÍLIO ---
    window.renderizarProdutos = () => {
        const grid = document.getElementById('gridProdutos');
        const busca = document.getElementById('inputBusca').value.toLowerCase();
        const filtrados = produtos.filter(p => p.nome.toLowerCase().includes(busca));
        grid.innerHTML = filtrados.map(p => `
            <div class="product-card" onclick="addCarrinho('${p.firebaseId}')">
                <div class="h-24 bg-slate-100 rounded-xl mb-3 overflow-hidden">
                    <img src="${p.img}" class="w-full h-full object-cover">
                </div>
                <h3 class="text-[10px] font-bold uppercase truncate">${p.nome}</h3>
                <p class="text-sm font-black mt-1">R$ ${p.preco.toFixed(2)} <span class="text-[8px] text-slate-400">/${p.unidade}</span></p>
            </div>
        `).join('');
    };

    window.switchTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelector(`button[onclick="switchTab('${id}')"]`).classList.add('active');
    };

    window.notificar = (msg) => {
        const t = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        t.classList.replace('opacity-0', 'opacity-100');
        setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2500);
    };

    window.fazerLoginEmail = async () => {
        const e = document.getElementById('loginEmail').value;
        const s = document.getElementById('loginPassword').value;
        try { await signInWithEmailAndPassword(auth, e, s); } catch (err) { alert("Erro no Login"); }
    };
       
    window.logout = () => signOut(auth).then(() => location.reload());
    window.removerItem = (idx) => { carrinho.splice(idx, 1); window.atualizarCarrinho(); };
    window.renderizarEstoque = () => {}; // Opcional: implementar lista detalhada
</script>
</body>
</html>
